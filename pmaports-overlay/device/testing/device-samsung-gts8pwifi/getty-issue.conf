# Alpine's agetty renders nothing for the DEFAULT issue path (verified:
# `agetty --show-issue` prints empty while `--show-issue -f /etc/issue`
# renders perfectly). Pass the file explicitly so the generated banner
# (see netinfo-console) actually reaches the login screen.
[Service]
ExecStart=
ExecStart=-/usr/sbin/agetty --noreset --noclear --issue-file /etc/issue - ${TERM}
