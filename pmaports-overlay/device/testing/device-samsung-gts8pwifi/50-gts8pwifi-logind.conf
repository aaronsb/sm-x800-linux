# The folio-state daemon publishes SW_LID on a virtual input device and
# console-blank owns the display policy (ADR-002). logind must not act on
# the lid: suspend is untested and DPMS off hangs the tablet (issue #41).
# HandlePowerKey=ignore is already the postmarketOS default here.
[Login]
HandleLidSwitch=ignore
HandleLidSwitchExternalPower=ignore
HandleLidSwitchDocked=ignore
