# MTP responder for the USB gadget (gts8pwifi-usb-gadget): the PC's file
# manager sees the tablet as a media device and browses the storages below.
# umtprd runs as root; files the PC creates belong to the default user.

loop_on_disconnect 1

storage "/home/user" "Home" "rw"

# Dot-files stay off the cable: MTP has no authentication, and a writable
# ~/.ssh would let anyone with a USB cable add an authorized key.
show_hidden_files 0

default_uid 10000
default_gid 10000
umask 022

manufacturer "Samsung"
product "Galaxy Tab S8+"
serial "gts8pwifi"
firmware_version "postmarketOS"
interface "MTP"

# FunctionFS instance "mtp" of the gadget, mounted at /dev/mtp
usb_functionfs_mode 0x1
usb_dev_path   "/dev/mtp/ep0"
usb_epin_path  "/dev/mtp/ep1"
usb_epout_path "/dev/mtp/ep2"
usb_epint_path "/dev/mtp/ep3"
usb_max_packet_size 0x200
