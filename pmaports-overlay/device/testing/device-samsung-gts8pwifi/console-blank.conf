# Console idle blanking (console-blank.service, /usr/bin/console-blank).
# Minutes without input before the console goes black (fbcon unbound,
# framebuffer zeroed; on the AMOLED an unlit pixel is off). Any key or touch
# brings it back. 0 disables. DPMS is not used, see issue #41.
# With the folio closed (SW_LID from folio-state, ADR-002) the console is
# dark regardless of this setting; the power button toggles it when open.
# Apply a change with: systemctl restart console-blank
BLANK_MIN=10
