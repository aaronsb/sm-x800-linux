SectionVerb {
	EnableSequence [
		# Frontend -> backend: MultiMedia1 feeds PRIMARY_MI2S_RX, where
		# the four CS35L45 amplifiers listen.
		cset "name='PRIMARY_MI2S_RX Audio Mixer MultiMedia1' 1"
		# Capture: the DMICs arrive through the VA macro's own LPASS DMA
		# lane (VA_CODEC_DMA_TX_0) into MultiMedia3.
		cset "name='MultiMedia3 Mixer VA_CODEC_DMA_TX_0' 1"
	]

	DisableSequence [
		cset "name='PRIMARY_MI2S_RX Audio Mixer MultiMedia1' 0"
		cset "name='MultiMedia3 Mixer VA_CODEC_DMA_TX_0' 0"
	]

	Value {
		TQ "HiFi"
	}
}

SectionDevice."Speaker" {
	Comment "Built-in speakers (4x CS35L45)"

	EnableSequence [
		cset "name='Front Left AMP Enable Switch' 1"
		cset "name='Front Right AMP Enable Switch' 1"
		cset "name='Rear Left AMP Enable Switch' 1"
		cset "name='Rear Right AMP Enable Switch' 1"
	]

	DisableSequence [
		cset "name='Front Left AMP Enable Switch' 0"
		cset "name='Front Right AMP Enable Switch' 0"
		cset "name='Rear Left AMP Enable Switch' 0"
		cset "name='Rear Right AMP Enable Switch' 0"
	]

	Value {
		PlaybackChannels 2
		PlaybackPriority 100
		# MultiMedia1 Playback
		PlaybackPCM "hw:${CardId},0"
		# No PlaybackMixer on purpose: volume lives in four independent
		# per-amplifier controls with no master. Given a mixer the sound
		# server flags the sink HARDWARE and stops attenuating in software,
		# writing to a control that does not move the output. Without one
		# it attenuates in software and keeps all four amps in step; the
		# hardware volumes are pinned in the BootSequence.
	}
}

SectionDevice."Mic" {
	Comment "Built-in digital microphones"

	EnableSequence [
		# DMIC1 (bottom) / DMIC3 (back) -> decimators 0/1 -> VA AIF1
		# capture: stock's stereo pair (mixer_paths.xml sub-main-mic).
		# Three mics exist, DMIC1, DMIC2, DMIC3; DMIC0 is empty.
		cset "name='VA DMIC MUX0' DMIC1"
		cset "name='VA DMIC MUX1' DMIC3"
		cset "name='VA DEC0 MUX' VA_DMIC"
		cset "name='VA DEC1 MUX' VA_DMIC"
		cset "name='VA_AIF1_CAP Mixer DEC0' 1"
		cset "name='VA_AIF1_CAP Mixer DEC1' 1"
		cset "name='VA_DEC0 Volume' 80%"
		cset "name='VA_DEC1 Volume' 80%"
	]

	DisableSequence [
		cset "name='VA_AIF1_CAP Mixer DEC0' 0"
		cset "name='VA_AIF1_CAP Mixer DEC1' 0"
		cset "name='VA DMIC MUX0' ZERO"
		cset "name='VA DMIC MUX1' ZERO"
	]

	Value {
		CaptureChannels 2
		CapturePriority 100
		# MultiMedia3 Capture
		CapturePCM "hw:${CardId},2"
		# Software volume: the VA decimator gains are per channel and
		# there is no master capture control to expose.
	}
}
