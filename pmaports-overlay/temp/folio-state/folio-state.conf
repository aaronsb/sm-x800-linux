# folio-state daemon (folio-state.service, /usr/bin/foliod). Fuses the pogo
# keyboard, the hall switches and the magnetometer into SW_LID and
# SW_PEN_INSERTED on the "folio-state" input device. ADR-002.
# Apply a change with: systemctl restart folio-state
# Check a reading by hand with: foliod --once

# Seconds between magnetometer samples while nothing changes, in the bare
# and docked contexts. 0 disables that heartbeat; transitions still sample.
HEARTBEAT_S=60

# The same while the folio is attached but off the pogo pins (keyboard
# absent, hall 23 asserted). Closing or opening it there moves only the
# magnetometer, so this is the close-to-blank and open-to-wake latency.
# console-blank also sends SIGUSR1 on input while closed, which samples
# at once.
ATTACHED_HEARTBEAT_S=3

# A light reading strictly above this many lux vetoes "lid closed". A closed
# folio read 0 and an open one 5 on 2026-09-22.
LIGHT_VETO_LUX=2

# Thresholds are deltas in microtesla from a baseline learned per context.
# Defaults are half the 2026-09-22 differences (issue #33), except the
# reversed margins (measured -33 on Z, -48 on X), which are set close to
# the readings because a rotation moves about 50 between axes. The
# reversed verdict needs two consecutive samples.
PEN_DZ_BARE=112
PEN_DZ_DOCKED=130
REVERSED_DZ=25
REVERSED_DX=40
CLOSED_DZ=85

# Seeds for the baselines (2026-09-22 rows). The first open no-pen sample
# in a context sets the baseline, later ones move it by an eighth of the
# difference. A sample farther than BASELINE_WINDOW from the seed on Z is
# never learned.
BASE_Z_BARE=133
BASE_X_BARE=206
BASE_Z_DOCKED=-305
BASELINE_WINDOW=150

# Without a magnetometer sample the lid holds its last value while the
# folio is attached; after this many failed samples in a row, or when the
# daemon has no magnetometer at all, hall 23 asserted alone means closed.
FALLBACK_AFTER=3

# Magnetometer readings averaged per sample, and how long a whole sample
# may take before the daemon classifies on the hard signals alone.
MAG_SAMPLES=3
SAMPLE_TIMEOUT_S=10

# Pen forgotten: "strip" logs the edge when the lid closes and the last
# open sample saw no pen on the back strip. Off by default: the pen
# normally lives in the folio's holder, which the sensors cannot see apart
# from a 15 microtesla difference in the closed state that ADR-002 lists
# as a follow-up, so with the pen in the holder every close would fire it.
PEN_FORGOTTEN=off
